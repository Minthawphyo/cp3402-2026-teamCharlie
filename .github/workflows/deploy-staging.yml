name: Deploy to Staging

on:
  push:
    branches:
      - staging
    paths:
      - "coffee-shop/charlies-coffee/**"
  workflow_dispatch: {}

jobs:
  test:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint theme PHP files
        run: |
          find coffee-shop/charlies-coffee -name "*.php" -print0 \
            | xargs -0 -I{} php -l "{}"

  ftp-deploy:
    name: FTP deploy theme to staging
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: ./coffee-shop/charlies-coffee/
          server-dir: ./charliescoffeestaging.site.je/htdocs/wp-content/themes/charlies-coffee/
          dangerous-clean-slate: false
