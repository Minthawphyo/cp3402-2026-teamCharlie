name: Deploy to Staging

on:
  push:
    branches:
      - staging
    paths:
      - "coffee-shop/charlies-coffee/**"
  workflow_dispatch: {}

jobs:
  test:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint theme PHP files
        run: |
          find coffee-shop/charlies-coffee -name "*.php" -print0 \
            | xargs -0 -I{} php -l "{}"

  ftp-deploy:
    name: FTP deploy theme to staging
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: ./coffee-shop/charlies-coffee/
          server-dir: ./charliescoffeestaging.atwebpages.com/wp-content/themes/charlies-coffee/
          dangerous-clean-slate: false

  smoke-test:
    name: Verify staging site responds
    needs: ftp-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check key pages return 200
        run: |
          sleep 5
          fail=0
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          for url in \
            "http://charliescoffeestaging.atwebpages.com/" \
            "http://charliescoffeestaging.atwebpages.com/menu/" \
            "http://charliescoffeestaging.atwebpages.com/about/" \
            "http://charliescoffeestaging.atwebpages.com/contact/" \
          ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" -L --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors "$url" || echo "000")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code, expected 200"
              fail=1
            fi
          done
          exit $fail
