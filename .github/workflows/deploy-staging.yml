name: Deploy to Staging

on:
  push:
    branches:
      - staging
    paths:
      - "coffee-shop/charlies-coffee/**"
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    name: FTP deploy theme to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: ./coffee-shop/charlies-coffee/
          server-dir: ./htdocs/wp-content/themes/charlies-coffee/
          dangerous-clean-slate: false
